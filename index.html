<!doctype html>
<!--
  index.html：ページの骨組み（どこに何を置くか）だけを書いたファイルです。
  中身（会社名・日付など）は data/schedule.json から app.js が読み込んで描きます。
  日程の更新でこのファイルを触る必要はありません。
-->
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>28卒 ゲーム・CG就活カレンダー</title>
  <meta name="description" content="28卒（2028年3月卒）向け、ゲーム・CG業界のインターン・本選考の締切一覧">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <h1>28卒 ゲーム・CG就活カレンダー</h1>
      <p class="next" id="next-box"></p>
    </div>
  </header>

  <main class="wrap">
    <!-- 職種の切り替え・締切済みを隠す・今日へ -->
    <div class="toolbar">
      <div id="role-filters" class="chips" role="group" aria-label="職種"></div>
      <label class="toggle"><input type="checkbox" id="hide-past"> 締切済みを隠す</label>
      <button type="button" id="today-btn" class="btn">今日へ</button>
    </div>

    <p id="message" class="message" hidden></p>

    <!-- タイムライン：左に会社名（タップで開閉）、右に週ごとの目盛り。横にスクロールできる -->
    <section class="chart" aria-label="タイムライン">
      <div class="chart-scroll" id="chart-scroll">
        <div class="chart-inner">
          <div class="left-col" id="left-col"></div>
          <div id="chart-area"></div>
        </div>
      </div>
      <input type="range" id="slider" class="slider" min="0" max="0" value="0" aria-label="表示する時期を左右に移動">
    </section>

    <!-- 締切の行をタップしたときの詳細 -->
    <div id="detail" class="detail" hidden></div>
  </main>

  <!-- 一番下：最終更新日・凡例・注意事項・表示テーマ -->
  <footer class="site-footer">
    <details class="wrap info">
      <summary>最終更新 <span id="updated-at">—</span>・凡例と注意事項</summary>
      <ul class="legend" id="legend"></ul>
      <ul class="notes">
        <li>日程は変わることがあります。応募前に必ず各社の公式ページで確認してください。</li>
        <li>⚠ の付いた項目は「要再確認」または「前年実績からの推測」です。</li>
        <li>日付・残り日数は日本時間で計算しています。</li>
      </ul>
      <button type="button" class="btn" id="theme-btn">表示：自動</button>
    </details>
  </footer>

  <script src="app.js"></script>
</body>
</html>
